name: Update reward dictionary

# Pulls fresh character, Arc and item names from the community datamine every
# day. A commit triggers a Cloudflare Pages rebuild, so the site learns new
# characters on its own.
on:
  schedule:
    - cron: '17 5 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: node scripts/update-rewards.mjs
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - run: npm test
      - name: Commit if changed
        run: |
          if git status --porcelain src/data public/portraits | grep -q .; then
            git config user.name "hethereau-bot"
            git config user.email "actions@users.noreply.github.com"
            git add src/data public/portraits
            git commit -m "Update reward dictionary"
            git push
          else
            echo "No changes"
          fi
